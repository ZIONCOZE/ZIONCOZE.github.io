<script>
(function(){
  function fix(img){
    if(img._r === undefined) img._r = 0;
    if(img._r >= 4) return;
    if(img.closest && img.closest('.img-lightbox, .lightbox')) return;
    var base = (img.currentSrc || img.src || '').split('?')[0];
    if(!base || base.indexOf('data:') === 0 || base.indexOf('/assets/') === -1) return;
    setTimeout(function(){ img.src = base + '?r=' + img._r + '.' + Date.now(); }, 500 * img._r);
  }
  window.addEventListener('error', function(e){
    var t = e.target;
    if(t && t.tagName === 'IMG' && !t.id) fix(t);
  }, true);
  window.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){
      document.querySelectorAll('img').forEach(function(img){
        if(img.id) return; // 灯箱大图容器不处理
        if(img.complete && img.naturalWidth === 0 && img.src) fix(img);
      });
    }, 1500);
  });
})();
</script></head>
